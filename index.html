<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็คชื่อออนไลน์</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050806;--panel:#0b120e;--panel2:#0f1913;--line:#1b2c22;--text:#e8f5ee;--muted:#7f9c8d;
  --green:#39ff88;--green2:#1fd46a;--green3:#0e7a3c;--glow:rgba(57,255,136,.28);
  --amber:#ffd23f;--red:#ff5c6c;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Kanit',system-ui,sans-serif;font-size:16px}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 10% -10%,rgba(57,255,136,.10),transparent 60%),
  radial-gradient(700px 400px at 110% 10%,rgba(31,212,106,.08),transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 4px),var(--bg)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom))}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
.meme-title{font-weight:900;font-size:clamp(28px,6vw,46px);line-height:1;margin:0;letter-spacing:.5px;
  color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;
  text-shadow:3px 3px 0 var(--green3),0 0 24px var(--glow);transform:rotate(-1.5deg)}
.meme-title span{color:var(--green)}
.sub{color:var(--muted);margin-top:8px;font-size:15px}
.sub b{color:var(--text)}
.clock{background:var(--panel);border:2px solid var(--green3);border-radius:var(--r);padding:10px 16px;text-align:right;
  box-shadow:4px 4px 0 #000,0 0 30px rgba(57,255,136,.08)}
.clock .t{font-size:30px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1}
.clock .d{font-size:13px;color:var(--muted)}
.mood{display:inline-block;margin-top:4px;font-size:13px;padding:2px 10px;border-radius:99px;background:rgba(57,255,136,.12);color:var(--green)}
.mood.late{background:rgba(255,210,63,.12);color:var(--amber)}
.setup{max-width:520px;margin:12vh auto 0;text-align:center;background:var(--panel);border:2px solid var(--green3);border-radius:var(--r);padding:28px 22px;box-shadow:8px 8px 0 #000}
.setup .e{font-size:64px}
.setup h2{margin:6px 0 8px}
.setup p{color:var(--muted);margin:6px 0}
.setup code{background:#000;color:var(--green);padding:2px 8px;border-radius:6px;font-size:14px;word-break:break-all}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;
  box-shadow:4px 4px 0 #000}
.stat .n{font-size:34px;font-weight:900;line-height:1}
.stat .l{color:var(--muted);font-size:14px}
.stat .e{position:absolute;right:10px;top:8px;font-size:28px;opacity:.9}
.stat.g .n{color:var(--green)} .stat.y .n{color:var(--amber)} .stat.r .n{color:var(--red)}

/* ---------- layout ---------- */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:400px minmax(0,1fr)}.checkin{position:sticky;top:14px;align-self:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:6px 6px 0 #000}
.card h2{margin:0 0 4px;font-size:22px;font-weight:700}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
select,input[type=search]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
select:focus,input:focus{border-color:var(--green2);box-shadow:0 0 0 3px var(--glow)}
.combo{position:relative}
.combo input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 40px 12px 14px;outline:none}
.combo input[type=text]:focus{border-color:var(--green2);box-shadow:0 0 0 3px var(--glow)}
.combo.picked input[type=text]{border-color:var(--green2);color:var(--green);font-weight:500}
.cx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;display:none}
.combo.has .cx{display:block}
.opts{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#0a110d;border:1px solid var(--green3);border-radius:12px;
  max-height:min(300px,45vh);overflow:auto;display:none;box-shadow:6px 6px 0 #000,0 10px 30px rgba(0,0,0,.6);overscroll-behavior:contain}
.combo.open .opts{display:block}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;border-bottom:1px solid #121e17}
.opt:last-child{border-bottom:0}
.opt .oe{font-size:20px;flex:none}
.opt .on{flex:1;min-width:0}
.opt .on b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .on small{color:var(--muted);font-size:12.5px}
.opt mark{background:rgba(57,255,136,.25);color:var(--green);border-radius:3px;padding:0 1px}
.opt.act,.opt:hover{background:rgba(57,255,136,.1)}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt.dis:hover{background:none}
.onone{padding:16px;text-align:center;color:var(--muted)}
.warn{margin:-4px 0 12px;font-size:clamp(20px,5vw,24px);font-weight:900;line-height:1.25;color:#fff;
  -webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:2px 2px 0 var(--green3)}
.formmeme video{max-width:100%;max-height:240px;border:3px solid #fff;border-radius:6px;box-shadow:6px 6px 0 var(--green3);background:#000;display:block}
.meme video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.formmeme{margin:-2px 0 12px;display:none;justify-content:center}
.formmeme.on{display:flex}
.formmeme iframe{width:100%;max-width:340px;aspect-ratio:4/3;border:3px solid #fff;border-radius:6px;box-shadow:6px 6px 0 var(--green3);background:#000;display:block}
.meme iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#000}
.formmeme img{max-width:100%;max-height:220px;border:3px solid #fff;border-radius:6px;box-shadow:6px 6px 0 var(--green3);background:#000;display:block}
.padwrap{position:relative;border:2px dashed var(--green3);border-radius:14px;background:
  linear-gradient(transparent 74%,rgba(57,255,136,.25) 74%,rgba(57,255,136,.25) calc(74% + 1px),transparent calc(74% + 1px)),#060a08}
#sig{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair;border-radius:12px}
.padph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none;font-size:15px;text-align:center}
.padwrap.inked .padph{display:none}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--muted);cursor:pointer}
.ghost:hover{color:var(--text);border-color:var(--green3)}
.agree{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:15px}
.agree input{width:22px;height:22px;accent-color:var(--green2);flex:none;margin:0}
.big{width:100%;border:0;border-radius:14px;padding:15px;font-size:19px;font-weight:700;cursor:pointer;color:#03140a;
  background:linear-gradient(180deg,var(--green),var(--green2));box-shadow:0 5px 0 var(--green3),0 0 30px var(--glow);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green3)}
.big:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed}

/* ---------- roster ---------- */
.rhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--green);color:#03140a;border-color:var(--green);font-weight:700}
.search{flex:1 1 200px;max-width:320px}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow:hidden;transition:border-color .2s}
.item.open{border-color:var(--green3);box-shadow:0 0 0 1px var(--green3),0 0 24px rgba(57,255,136,.08)}
.ih{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:none;border:0;text-align:left;cursor:pointer}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:#0a1a10;border:1px solid var(--line)}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:13px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.tm{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.badge{font-size:12.5px;padding:2px 10px;border-radius:99px;font-weight:500;white-space:nowrap}
.b-ok{background:rgba(57,255,136,.14);color:var(--green)}
.b-late{background:rgba(255,210,63,.14);color:var(--amber)}
.b-no{background:rgba(255,92,108,.12);color:var(--red)}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .25s;flex:none;margin:0 4px}
.item.open .chev{transform:rotate(-135deg);border-color:var(--green)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.item.open .det{grid-template-rows:1fr}
.det>div{overflow:hidden}
.dbody{padding:4px 14px 16px;border-top:1px dashed var(--line);display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.dbody{grid-template-columns:auto 1fr}}
.meme{position:relative;width:100%;max-width:300px;aspect-ratio:1/1;margin:12px auto 0;background:#000;border:3px solid #fff;border-radius:4px;overflow:hidden;box-shadow:6px 6px 0 var(--green3)}
@media(min-width:640px){.dbody{grid-template-columns:260px 1fr}.meme{width:260px}}
.meme img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#000}
.meme .fb{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;
  background:radial-gradient(circle at 50% 55%,rgba(57,255,136,.35),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px),#06130b}
.meme .fb span{animation:wobble 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.6))}
.meme.ghost .fb{background:radial-gradient(circle at 50% 55%,rgba(255,92,108,.3),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px),#140608}
.meme.risk .fb{background:radial-gradient(circle at 50% 55%,rgba(255,210,63,.3),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px),#141006}
.meme .cap{position:absolute;left:8px;right:8px;text-align:center;font-weight:900;font-size:21px;line-height:1.15;color:#fff;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 2px 0 #000;word-break:break-word;z-index:1}
.meme .cap.t{top:8px}.meme .cap.b{bottom:10px}
.statrow{display:flex;align-items:center;gap:14px}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel2)}
.ring span{position:relative;z-index:1;font-size:21px;font-weight:900}
.rank{font-weight:700;font-size:17px}
.rank small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.nums div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.nums b{display:block;font-size:20px}
.nums small{color:var(--muted);font-size:12px}
.sec{font-size:13px;color:var(--muted);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.ok{color:var(--green);border-color:rgba(57,255,136,.3)}
.chip.late{color:var(--amber);border-color:rgba(255,210,63,.3)}
.chip.no{color:var(--red);border-color:rgba(255,92,108,.3)}
.sigimg{background:#060a08;border:1px solid var(--line);border-radius:10px;padding:6px;max-width:260px}
.sigimg img{display:block;width:100%;height:auto}
.quip{font-style:italic;color:var(--text);background:#000;border-left:4px solid var(--green);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14.5px}
.mini{margin-top:10px;border:1px solid var(--green3);background:transparent;color:var(--green);border-radius:10px;padding:8px 12px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty div{font-size:46px}

/* ---------- meme popup ---------- */
.pop{position:fixed;inset:0;display:none;place-items:center;z-index:50;background:rgba(0,0,0,.72);padding:20px}
.pop.show{display:grid}
.memecard{width:min(420px,100%);background:#000;border:3px solid #fff;border-radius:6px;padding:18px 16px 16px;text-align:center;
  box-shadow:10px 10px 0 var(--green3);animation:boing .5s cubic-bezier(.2,1.6,.4,1)}
.mtop,.mbot{font-weight:900;font-size:clamp(22px,6vw,30px);line-height:1.15;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:2px 2px 0 #000}
.memo{font-size:96px;line-height:1.2;margin:8px 0;display:inline-block;animation:wobble 1s ease-in-out infinite}
.mmeta{color:var(--muted);font-size:14px;margin-top:10px}
.memecard .big{margin-top:14px}
.memecard.err{box-shadow:10px 10px 0 #5a1119}
.memecard.err .mtop{color:var(--red)}
@keyframes boing{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.rain{position:fixed;top:-60px;font-size:34px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center}
.loading div{font-size:56px;animation:wobble .8s infinite}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
.foot button{background:none;border:0;color:var(--green);cursor:pointer;text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading"><div>🐸</div>กำลังปลุกระบบให้ตื่น...</div>
</div>

<div class="pop" id="pop"><div class="memecard" id="memecard"></div></div>

<script>
/* =================== helpers =================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const pick = a => a[Math.floor(Math.random() * a.length)];
const toMin = hm => { const [h, m] = String(hm).split(':').map(Number); return h * 60 + m; };
const fromMin = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const hashPick = (id, arr) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return arr[h % arr.length]; };

const AVATARS = ['🐸','🐱','🐶','🦊','🐼','🐵','🐧','🦖','🐹','🐨','🐯','🦄','🐙','🐢','🦆','🐻'];
const QUIPS = {
  ok:   ['มาตรงเวลา ตัวตึงจริง 😎','ตื่นทันด้วยเหรอ ภูมิใจมาก 🫡','นาฬิกาชีวิตแม่นยำสุดๆ ⏰','ครูยิ้มแก้มปริ 🥹','มาเช้าแบบนี้ เกรดสี่รออยู่ 🏆'],
  late: ['สายแต่มา ยังดีกว่าไม่มา 🐢','นาฬิกาปลุกพังอีกแล้วเหรอ 💀','รถติด... ในห้องนอนใช่ไหม 🛏️','ช้าแต่ชัวร์ 🦥','มาแบบตัวละครหลัก เข้าฉากทีหลัง 🎬'],
  no:   ['หายไปไหนน้า 👻','ยังไม่เห็นเงาเลย 🔍','สถานะ: กำลังโหลด... ⏳','ผ้าห่มยังไม่ปล่อย 🛌'],
};
const POP = {
  ok:   {top:'เช็คชื่อเรียบร้อย', emo:['😎','🫡','🔥','🏆','🐸'], bot:['ตรงเวลา ปังมาก!','วันนี้ตัวตึงห้อง','เด็กดีประจำวัน']},
  late: {top:'เช็คชื่อแล้วจ้า แต่...', emo:['🐢','💀','🦥','😅'], bot:['สายนะจ๊ะ ครูเห็นนะ','พรุ่งนี้มาเช้ากว่านี้นะ','สายแต่ไม่ตาย']},
};
function rankOf(rate, total){
  if (total < 3) return {k:'new', e:'🐣', t:'น้องใหม่ 🐣', s:'เพิ่งเริ่มเรียน สถิติยังไม่พอ'};
  if (rate >= 95) return {k:'top', e:'😎', t:'ตัวตึงประจำห้อง 🔥', s:'มาทุกคาบ ครูรักที่สุด'};
  if (rate >= 80) return {k:'good', e:'😌', t:'สายชิลแต่มาครบ 😌', s:'โอเคอยู่นะ'};
  if (rate >= 60) return {k:'risk', e:'😬', t:'เริ่มเสี่ยงแล้วนะ 😬', s:'ระวังหมดสิทธิ์สอบ'};
  return {k:'ghost', e:'👻', t:'ตำนานผู้หายตัว 👻', s:'ครูเริ่มจำหน้าไม่ได้'};
}
const MEME_DEFAULT = {
  top:   {top:'ครูเช็คชื่อทุกคาบ', bot:'{name}: มาครบ ไม่เคยพลาด'},
  good:  {top:'', bot:'อย่าให้มีครั้งที่ 2'},
  risk:  {top:'ฉันรู้ว่าคุณต้องมา', bot:'ฉันอยู่นี่แล้ว'},
  ghost: {top:'ครู: {name} มาไหม', bot:'ทั้งห้อง: ใครอะ?'},
  new:   {top:'เพิ่งเริ่มคาบแรก', bot:'ยังไม่มีอะไรให้แซว'},
};

/* =================== API (Apps Script) =================== */
const CFG = window.APP_CONFIG || {};
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const API_URL = !IS_GAS && /^https:\/\/script\.google\.com\//.test(CFG.API_URL || '') ? CFG.API_URL : '';
const MODE = IS_GAS ? 'gas' : API_URL ? 'api' : 'none';

/* เรียก Apps Script Web App ผ่าน fetch (ใช้ตอนเปิดเว็บจาก GitHub Pages) */
async function viaFetch(fn, arg){
  const r = fn === 'getData'
    ? await fetch(API_URL + '?action=getData&t=' + Date.now(), {redirect: 'follow'})
    : await fetch(API_URL, {method: 'POST', redirect: 'follow',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},   // text/plain = ไม่ติด CORS preflight
        body: JSON.stringify({action: fn, payload: arg})});
  if (!r.ok) throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (' + r.status + ')');
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
}

function api(fn, arg){
  if (MODE === 'api') return viaFetch(fn, arg);
  return new Promise((res, rej) => {
    if (IS_GAS) {
      google.script.run.withSuccessHandler(res)
        .withFailureHandler(e => rej(new Error((e && e.message) || String(e))))[fn](arg);
    } else {
      rej(new Error('ยังไม่ได้เชื่อม Google Sheet'));
    }
  });
}

function derive(){
  const {records, today} = DATA;
  const days = [...new Set(records.map(r => r.date))].sort();
  const by = {}; records.forEach(r => { (by[r.id] = by[r.id] || {})[r.date] = r; });
  return {days, by, todayMap: Object.fromEntries(records.filter(r => r.date === today).map(r => [r.id, r]))};
}

function statsFor(id, d){
  const m = d.by[id] || {}; let on = 0, late = 0, abs = 0; const hist = [];
  const first = Object.keys(m).sort()[0];          // นับตั้งแต่วันแรกที่เริ่มเข้าเรียน (คนที่ไม่เคยมาเลย นับทุกวัน)
  d.days.forEach(day => {
    if (first && day < first) return;
    const r = m[day];
    if (day === DATA.today && !r) return;          // วันนี้ยังไม่มา ยังไม่นับขาด
    if (!r) { abs++; hist.push({day, s: 'ขาด'}); }
    else { r.status === 'สาย' ? late++ : on++; hist.push({day, s: r.status, t: r.time}); }
  });
  const total = on + late + abs;
  return {on, late, abs, total, rate: total ? Math.round((on + late) / total * 100) : 0, hist: hist.reverse()};
}

            <div class="rank">${rk.t}<small>${rk.s}</small></div>
          </div>

          <div class="nums">
            <div><b>${S.total}</b><small>คาบทั้งหมด</small></div>
            <div><b style="color:var(--green)">${S.on}</b><small>ตรงเวลา</small></div>
            <div><b style="color:var(--amber)">${S.late}</b><small>สาย</small></div>
            <div><b style="color:var(--red)">${S.abs}</b><small>ขาด</small></div>
          </div>
          ${r ? `<div class="sec">ลายเซ็นวันนี้ (${r.time} น.)</div>${r.sig ? `<div class="sigimg"><img alt="ลายเซ็น" src="${esc(r.sig)}"></div>` : '<small class="tm">— ไม่มีภาพลายเซ็น —</small>'}`
               : `<button class="mini" data-pick="${esc(st.id)}">✍️ เช็คชื่อคนนี้</button>`}
          <div class="sec">ประวัติการเข้าเรียน</div>
          <div class="chips">${S.hist.length ? S.hist.slice(0, 30).map(h => `<span class="chip ${cls(h.s)}" title="${h.t ? h.t + ' น.' : 'ขาดเรียน'}">${thDate(h.day)} ${h.s === 'ตรงเวลา' ? '✓' : h.s === 'สาย' ? '🐢' : '✗'}</span>`).join('') : '<small class="tm">ยังไม่มีประวัติ</small>'}</div>

function loadMemeImgs(el){ el.querySelectorAll('img[data-src],iframe[data-src],video[data-src]').forEach(i => { i.src = i.dataset.src; i.removeAttribute('data-src'); }); }

/* =================== clock =================== */
function tick(){
  const now = new Date();
  $('#ct').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  $('#cd').textContent = now.toLocaleDateString('th-TH', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  if (!DATA) return;
  const s = DATA.settings, cur = now.getHours() * 60 + now.getMinutes(), lim = toMin(s.startTime) + Number(s.lateMinutes || 0);
  const m = $('#cmood');
  if (cur < toMin(s.startTime)) { m.className = 'mood'; m.textContent = `อีก ${toMin(s.startTime) - cur} นาทีเข้าเรียน ☕`; }
  else if (cur <= lim) { m.className = 'mood'; m.textContent = `รีบเลย! เหลือ ${lim - cur} นาที ⚡`; }
  else { m.className = 'mood late'; m.textContent = `เลยเวลาแล้ว ลงชื่อ = สาย 🐢`; }
  $('#lateWarn').textContent = cur > lim ? '⚠️ ตอนนี้จะถูกบันทึกเป็น "สาย"' : '';
}

/* =================== searchable name picker =================== */
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '').replace(/^(นางสาว|นาง|นาย|ด\.ช\.|ด\.ญ\.)/, '');
let actIdx = -1, shown = [];
function initCombo(){
  const inp = $('#whoInput'), box = $('#combo');
  inp.addEventListener('focus', () => { inp.select(); openCombo(); });
  inp.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== inp) closeCombo(); }, 150));
  inp.addEventListener('input', () => { $('#who').value = ''; box.classList.remove('picked'); actIdx = -1; openCombo(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!box.classList.contains('open')) openCombo();
      const ok = shown.map((s, i) => s.dis ? -1 : i).filter(i => i >= 0); if (!ok.length) return;
      const p = ok.indexOf(actIdx);
      actIdx = e.key === 'ArrowDown' ? ok[(p + 1) % ok.length] : ok[(p - 1 + ok.length) % ok.length];
      paintAct();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const ok = shown.filter(s => !s.dis);
      const t = shown[actIdx] && !shown[actIdx].dis ? shown[actIdx] : (ok.length === 1 ? ok[0] : null);
      if (t) { setWho(t.id); inp.blur(); }
    } else if (e.key === 'Escape') closeCombo();
  });
  $('#whoClear').onclick = () => { setWho(''); inp.focus(); };
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) closeCombo(); });
}
function openCombo(){ $('#combo').classList.add('open'); $('#whoInput').setAttribute('aria-expanded', 'true'); renderOpts(); }
function closeCombo(){
  $('#combo').classList.remove('open'); $('#whoInput').setAttribute('aria-expanded', 'false');
  const id = $('#who').value, st = id && DATA.students.find(s => s.id === id);
  $('#whoInput').value = st ? st.name : (id ? '' : $('#whoInput').value);
  $('#combo').classList.toggle('has', !!$('#whoInput').value);
}
function setWho(id){
  const st = id && DATA.students.find(s => s.id === id);
  $('#who').value = st ? st.id : '';
  $('#whoInput').value = st ? st.name : '';
  $('#combo').classList.toggle('picked', !!st);
  $('#combo').classList.toggle('has', !!st);
  closeCombo();
}
function hl(text, q){
  if (!q) return esc(text);
  // ไฮไลต์คำที่ค้นหา (เทียบแบบไม่สนช่องว่าง)
  const raw = String(text), map = []; let flat = '';
  for (let i = 0; i < raw.length; i++) if (!/\s/.test(raw[i])) { map.push(i); flat += raw[i].toLowerCase(); }
  const k = flat.indexOf(q); if (k < 0) return esc(raw);
  const s = map[k], e = map[k + q.length - 1] + 1;
  return esc(raw.slice(0, s)) + '<mark>' + esc(raw.slice(s, e)) + '</mark>' + esc(raw.slice(e));
}
function renderOpts(){
  if (!DATA || !$('#opts')) return;
  const inp = $('#whoInput'), picked = $('#combo').classList.contains('picked');
  const q = picked ? '' : String(inp.value || '').toLowerCase().replace(/\s+/g, '');
  const qn = norm(inp.value);
  $('#combo').classList.toggle('has', !!inp.value);
  const d = derive();
  shown = DATA.students.map(st => ({...st, r: d.todayMap[st.id]}))
    .filter(st => !q || norm(st.name).includes(qn) || st.name.toLowerCase().replace(/\s+/g, '').includes(q) || st.id.toLowerCase().includes(q) || String(st.room || '').toLowerCase().replace(/\s+/g, '').includes(q))
    .map(st => ({...st, dis: !!st.r}))
    .sort((a, b) => a.dis - b.dis);
  if (actIdx >= shown.length) actIdx = -1;
  if (q && actIdx < 0) actIdx = shown.findIndex(s => !s.dis);
  $('#opts').innerHTML = shown.length ? shown.map((st, i) => `
    <div class="opt ${st.dis ? 'dis' : ''} ${i === actIdx ? 'act' : ''}" role="option" data-i="${i}" aria-disabled="${st.dis}">
      <span class="oe">${st.dis ? '✅' : hashPick(st.id, AVATARS)}</span>
      <span class="on"><b>${hl(st.name, q)}</b><small>${hl(st.id, q)}${st.room ? ' · ' + hl(st.room, q) : ''}${st.dis ? ' · เช็คแล้ว ' + st.r.time.slice(0, 5) + ' น.' : ''}</small></span>
    </div>`).join('') : '<div class="onone">🦗 ไม่เจอชื่อนี้เลย ลองพิมพ์ใหม่</div>';
  $('#opts').querySelectorAll('.opt').forEach(o => o.addEventListener('pointerdown', e => {
    e.preventDefault(); const s = shown[+o.dataset.i];
    if (s.dis) return oops(s.name + ' เช็คชื่อไปแล้วเมื่อ ' + s.r.time.slice(0, 5) + ' น.');
    setWho(s.id); $('#whoInput').blur();
  }));
}
function paintAct(){
  $('#opts').querySelectorAll('.opt').forEach(o => o.classList.toggle('act', +o.dataset.i === actIdx));
  const a = $('#opts').querySelector('.opt.act'); if (a) a.scrollIntoView({block: 'nearest'});
}

/* =================== signature pad =================== */
let cv, ctx, drawing = false, inked = false, last = null, lastW = 0;
function initPad(){
  cv = $('#sig'); ctx = cv.getContext('2d');
  sizePad();
  window.addEventListener('resize', () => { if (cv.getBoundingClientRect().width !== lastW) sizePad(); });
  const pos = e => { const r = cv.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e);
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.4, 0, Math.PI * 2); ctx.fill(); markInk();
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return; e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evs.forEach(ev => { const p = pos(ev); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => drawing = false));
}
function sizePad(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  lastW = r.width; cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.8; ctx.strokeStyle = ctx.fillStyle = '#39ff88';
  inked = false; $('#padwrap').classList.remove('inked');
}
function markInk(){ inked = true; $('#padwrap').classList.add('inked'); }
function clearSig(){ ctx.clearRect(0, 0, cv.width, cv.height); inked = false; $('#padwrap').classList.remove('inked'); }
function exportSig(){
  const o = document.createElement('canvas'); o.width = 360; o.height = Math.round(360 * cv.height / cv.width);
  o.getContext('2d').drawImage(cv, 0, 0, o.width, o.height);
  return o.toDataURL('image/png');
}

/* =================== meme popup =================== */
function meme({top, emo, bot, meta, err}){
  const c = $('#memecard');
  c.className = 'memecard' + (err ? ' err' : '');
  c.innerHTML = `<div class="mtop">${esc(top)}</div><div class="memo">${emo}</div><div class="mbot">${esc(bot)}</div>
    ${meta ? `<div class="mmeta">${esc(meta)}</div>` : ''}<button class="big" type="button">${err ? 'โอเค เข้าใจแล้ว 😔' : 'เยี่ยม! 👍'}</button>`;
  $('#pop').classList.add('show');
  c.querySelector('button').onclick = closeMeme;
}
function closeMeme(){ $('#pop').classList.remove('show'); }
$('#pop').addEventListener('click', e => { if (e.target.id === 'pop') closeMeme(); });
function rain(set){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('div'); s.className = 'rain'; s.textContent = pick(set);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
    s.style.animationDelay = Math.random() * .6 + 's'; s.style.fontSize = (22 + Math.random() * 26) + 'px';
    document.body.appendChild(s); setTimeout(() => s.remove(), 4500);
  }
}
function oops(msg){
  meme({top: 'เดี๋ยวก่อนนน', emo: pick(['🤨','😵','🙅','🧐']), bot: msg, err: true});
  $('#form').classList.remove('shake'); void $('#form').offsetWidth; $('#form').classList.add('shake');
}

/* =================== actions =================== */
async function submit(){
  if (busy) return;
  const id = $('#who').value;
  if (!id) return oops('ยังไม่ได้เลือกชื่อเลย');
  if (!inked) return oops('ลืมเซ็นชื่อ! เซ็นก่อนน้า');
  if (!$('#agree').checked) return oops('ติ๊กยืนยันก่อนว่ามาเรียนจริง');
  busy = true; const btn = $('#go'); btn.disabled = true; btn.textContent = 'กำลังส่ง... 🛸';
  try {
    const res = await api('checkIn', {id, sig: exportSig(), confirm: true});
    DATA = res.data; render(); clearSig(); $('#agree').checked = false; setWho('');
    const k = res.record.status === 'สาย' ? 'late' : 'ok', P = POP[k];
    meme({top: P.top, emo: pick(P.emo), bot: pick(P.bot), meta: `${res.record.name} · ${res.record.time.slice(0, 5)} น. · ${res.record.status}`});
    rain(k === 'ok' ? ['🎉','🔥','😎','✨','💚','🐸'] : ['🐢','💀','⏰','😅','🦥']);
  } catch (e) {
    oops(e.message || 'มีบางอย่างผิดพลาด');
  } finally {
    busy = false; btn.disabled = false; btn.textContent = 'ยืนยันเข้าเรียน 🚀';
  }
}

async function load(manual){
  if (MODE === 'none') {
    $('#app').innerHTML = `<div class="setup"><div class="e">🔌🐸</div><h2>ยังไม่ได้เชื่อม Google Sheet</h2>
      <p>ใส่ลิงก์ Apps Script Web App ในไฟล์ <code>config.js</code></p>
      <p><code>API_URL: 'https://script.google.com/macros/s/.../exec'</code></p>
      <p>ดูขั้นตอนทั้งหมดได้ใน README.md</p></div>`;
    return;
  }
  try {
    DATA = await api('getData');
    if (!$('#form')) shell();
    render(); tick();
  } catch (e) {
    if (!$('#form')) $('#app').innerHTML = `<div class="loading"><div>💀</div>โหลดข้อมูลไม่ได้<br><small>${esc(e.message)}</small></div>`;
    else if (manual) oops('โหลดข้อมูลไม่ได้: ' + e.message);
  }
}

setInterval(tick, 1000);
setInterval(() => { if (!busy && !document.hidden && $('#form')) load(); }, 30000);
load();
